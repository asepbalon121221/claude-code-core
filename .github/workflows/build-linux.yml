name: build-linux

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Checks
        run: |
          bun run check:secrets
          bun run check:imports
          bun run check:router
      - name: Build linux-x64
        run: bun run build:linux-x64
      - name: Install ripgrep for smoke
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Smoke --version/--help
        run: |
          chmod +x dist/claude
          ./dist/claude --version
          ./dist/claude --help | head
      - name: Smoke router (optional)
        if: ${{ secrets.ANTHROPIC_AUTH_TOKEN != '' }}
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: https://xd-vps-production.up.railway.app/v1
          ANTHROPIC_MODEL: main
          USE_BUILTIN_RIPGREP: "0"
        run: bash scripts/smoke-linux.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-linux-x64
          path: |
            dist/claude
          if-no-files-found: error
      - name: Checksum
        run: sha256sum dist/claude | tee dist/claude.sha256
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: claude-linux-x64-sha256
          path: dist/claude.sha256
